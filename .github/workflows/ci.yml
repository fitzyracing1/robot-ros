name: ci
on: [push, pull_request]
jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pytest && python -m pytest -q tests && python -m robot_ros.demo
  ros2-jazzy:
    runs-on: ubuntu-latest
    container: ros:jazzy
    defaults: {run: {shell: bash}}
    steps:
      - uses: actions/checkout@v4
        with: {path: ws/src/robot_ros}
      - run: apt-get update && apt-get install -y python3-pytest
      - run: |
          source /opt/ros/jazzy/setup.bash
          cd ws && colcon build && source install/setup.bash
          python3 -c "import rclpy, robot_ros.ros_nodes; print('rclpy ok')"
          ls install/robot_ros/lib/robot_ros
          cd src/robot_ros && python3 -m pytest -q tests
